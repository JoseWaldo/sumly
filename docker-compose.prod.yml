name: sumly-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: sumly-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./apps/backend/db/init-users.sh:/docker-entrypoint-initdb.d/init-users.sh
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    image: ghcr.io/josewaldo/sumly-backend:latest
    container_name: sumly-prod-backend
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_MIGRATION_USER}:${POSTGRES_MIGRATION_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      PORT: 3000
      NODE_ENV: production
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgres

  frontend:
    image: ghcr.io/josewaldo/sumly-frontend:latest
    container_name: sumly-prod-frontend
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  postgres_prod_data:
