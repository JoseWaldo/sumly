name: sumly-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: sumly-dev-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  backend:
    image: ghcr.io/josewaldo/sumly-backend:dev
    container_name: sumly-dev-backend
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      PORT: 3000
      NODE_ENV: development
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    ports:
      - "3001:3000"
    depends_on:
      - postgres

  frontend:
    image: ghcr.io/josewaldo/sumly-frontend:dev
    container_name: sumly-dev-frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres_dev_data:
