name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
        run: cd apps/backend && bunx prisma generate

      - name: Lint
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
        run: bun run lint

  docker:
    name: Build & Push (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    permissions:
      contents: read
      packages: write
    env:
      OWNER_LC: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize owner to lowercase
        id: owner
        shell: bash
        run: |
          echo "lc=${OWNER_LC,,}" >> $GITHUB_OUTPUT
          echo "backend=ghcr.io/${OWNER_LC,,}/sumly-backend" >> $GITHUB_OUTPUT
          echo "frontend=ghcr.io/${OWNER_LC,,}/sumly-frontend" >> $GITHUB_OUTPUT

      - name: Set image tags
        id: tags
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_tag=latest" >> $GITHUB_OUTPUT
          else
            echo "env_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/dockerfile
          push: true
          tags: ${{ steps.owner.outputs.backend }}:${{ steps.tags.outputs.env_tag }},${{ steps.owner.outputs.backend }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/dockerfile
          push: true
          tags: ${{ steps.owner.outputs.frontend }}:${{ steps.tags.outputs.env_tag }},${{ steps.owner.outputs.frontend }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml,apps/backend/db
          target: ~/projects/sumly/prod/

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/projects/sumly/prod

            cat > .env << 'EOF'
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_APP_USER=${{ secrets.POSTGRES_APP_USER }}
            POSTGRES_APP_PASSWORD=${{ secrets.POSTGRES_APP_PASSWORD }}
            POSTGRES_MIGRATION_USER=${{ secrets.POSTGRES_MIGRATION_USER }}
            POSTGRES_MIGRATION_PASSWORD=${{ secrets.POSTGRES_MIGRATION_PASSWORD }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            EOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -p sumly-prod -f docker-compose.prod.yml pull
            docker compose -p sumly-prod -f docker-compose.prod.yml up -d --remove-orphans

            docker logout ghcr.io

  deploy-dev:
    name: Deploy to Dev/Test
    runs-on: ubuntu-latest
    environment: development
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.dev.yml,apps/backend/db
          target: ~/projects/sumly/dev/

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/projects/sumly/dev

            cat > .env << 'EOF'
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_APP_USER=${{ secrets.POSTGRES_APP_USER }}
            POSTGRES_APP_PASSWORD=${{ secrets.POSTGRES_APP_PASSWORD }}
            POSTGRES_MIGRATION_USER=${{ secrets.POSTGRES_MIGRATION_USER }}
            POSTGRES_MIGRATION_PASSWORD=${{ secrets.POSTGRES_MIGRATION_PASSWORD }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            EOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -p sumly-dev -f docker-compose.dev.yml pull
            docker compose -p sumly-dev -f docker-compose.dev.yml up -d --remove-orphans

            docker logout ghcr.io
